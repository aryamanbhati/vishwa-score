# Configuration for lint / format / test tooling.
# This project is not a distributable Python package (no `src/` module yet);
# it's a collection of Databricks notebooks + a Streamlit app. The
# `[project]` block is kept minimal for metadata only.

[project]
name = "vishwascore"
version = "0.1.0"
description = "Alternative credit scoring + multilingual voice financial advisor for Bharat. Databricks + Sarvam AI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aryaman Bhati" }]
keywords = ["credit-scoring", "databricks", "mlflow", "rag", "voice-ai", "financial-inclusion", "sarvam"]

[project.urls]
Repository = "https://github.com/aryamanbhati/vishwa-score"
Issues = "https://github.com/aryamanbhati/vishwa-score/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
